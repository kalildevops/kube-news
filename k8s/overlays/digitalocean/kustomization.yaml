apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-news

resources:
  - ../../base
  - secret.yaml
  - postgres.yaml

commonLabels:
  environment: digitalocean

images:
  - name: kube-news
    newName: kalildevops/kube-news
    newTag: latest

patches:
  - path: patch-deployment.yaml
  - path: patch-service.yaml
  - path: patch-hpa.yaml
  - path: patch-networkpolicy.yaml
  - target:
      group: external-secrets.io
      version: v1beta1
      kind: ExternalSecret
      name: kube-news-db
    patch: |
      $patch: delete
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: kube-news-db
  - target:
      group: external-secrets.io
      version: v1beta1
      kind: ClusterSecretStore
      name: aws-secrets
    patch: |
      $patch: delete
      apiVersion: external-secrets.io/v1beta1
      kind: ClusterSecretStore
      metadata:
        name: aws-secrets
