apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-news

resources:
  - ../../base

commonLabels:
  environment: prod

images:
  - name: kube-news
    newName: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/kube-news
    newTag: prod-COMMIT_SHA  # replaced by CI: kustomize edit set image

patches:
  - path: patch-deployment.yaml
  - path: patch-hpa.yaml
  - path: patch-externalsecret.yaml
