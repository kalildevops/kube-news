apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-news
  namespace: kube-news
  labels:
    app: kube-news
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kube-news
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: kube-news
      annotations:
        # DataDog APM auto-injection
        admission.datadoghq.com/enabled: "true"
        # DataDog Prometheus scrape
        ad.datadoghq.com/kube-news.check_names:  '["openmetrics"]'
        ad.datadoghq.com/kube-news.init_configs: '[{}]'
        ad.datadoghq.com/kube-news.instances: |
          [{
            "openmetrics_endpoint": "http://%%host%%:8080/metrics",
            "namespace": "kube_news",
            "metrics": ["http_requests_total", "nodejs_.*", "process_.*"]
          }]
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: kube-news
          image: kube-news:latest  # replaced by kustomize per environment
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: kube-news-db
                  key: host
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kube-news-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kube-news-db
                  key: password
            - name: DB_DATABASE
              value: kubedevnews
            - name: DB_PORT
              value: "5432"
            - name: DB_SSL_REQUIRE
              value: "true"
            # DataDog APM
            - name: DD_SERVICE
              value: kube-news
            - name: DD_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
