apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets
spec:
  provider:
    aws:
      service: SecretsManager  # overridden to ParameterStore in dev overlay
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kube-news-db
  namespace: kube-news
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: ClusterSecretStore
  target:
    name: kube-news-db
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: /kube-news/ENV/db  # replaced per overlay
        property: host
    - secretKey: username
      remoteRef:
        key: /kube-news/ENV/db
        property: username
    - secretKey: password
      remoteRef:
        key: /kube-news/ENV/db
        property: password
