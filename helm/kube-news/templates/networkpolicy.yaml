apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kube-news.name" . }}
  namespace: {{ include "kube-news.namespace" . }}
  labels:
    {{- include "kube-news.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kube-news.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - port: 5432
          protocol: TCP
