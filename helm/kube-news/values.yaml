image:
  repository: kalildevops/kube-news
  tag: latest
  pullPolicy: Always

replicaCount: 1

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

hpa:
  minReplicas: 1
  maxReplicas: 3
  cpuUtilization: 70
  memoryUtilization: 80

postgres:
  image: postgres:16-alpine
  storage: 5Gi
  database: kubedevnews
  credentials:
    username: ""
    password: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
